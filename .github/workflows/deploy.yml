name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Download Video from Google Drive
        run: |
          pip install gdown
          mkdir -p public/videos
          gdown 1rFYbpx2KPu5edwxwO5LlFQOOTmvFtEHk -O public/videos/regalo.mp4

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Install Dependencies
        run: npm install

      - name: Download Video from Google Drive
        run: |
          pip install gdown
          mkdir -p public/videos
          gdown 1rFYbpx2KPu5edwxwO5LlFQOOTmvFtEHk -O public/videos/regalo.mp4

      - name: Build
        run: npm run build
